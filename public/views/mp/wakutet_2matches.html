<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" type="text/css" href="/views/tetris.css" />
		<style>
			@import url('https://fonts.googleapis.com/css?family=M+PLUS+1p');

			@font-face {
				font-family: 'Misaki Gothic';
				src: url('/fonts/misaki_gothic.ttf');
			}

			#stream_bg {
				width: 1920px;
				height: 1000px;
				display: flex;
				flex-direction: column;
				flex-wrap: wrap;
				align-content: center;
				justify-content: center;
			}

			.box {
				position: revert;
				margin: -4.5px;
				font-size: 24px;
				line-height: 30px;
			}

			.box .header {
				padding-bottom: 2px;
			}

			.match {
				display: flex;
			}

			.match[hidden] {
				display: none;
			}

			.player {
				display: grid;
			}

			.p1 {
				grid-template:
					'. scores' auto
					'info board' auto
					'name name' auto /
					auto auto;
			}

			.p2 {
				grid-template:
					'scores .' auto
					'board info' auto
					'name name' auto /
					auto auto;
			}

			.scores {
				grid-area: scores;
				display: grid;
				grid-template:
					'score lines' auto
					'score next' auto /
					1fr auto;
				align-items: end;
			}

			.score {
				grid-area: score;
				padding: 3px;
				width: 224px;
				height: 100px;
			}

			.score .value,
			.score .diff {
				font-size: 32px;
				line-height: 36px;
				text-align: right;
				white-space: pre-wrap;
			}

			.lines {
				padding: 3px;
				width: 100px;
				height: 61px;
			}

			.next_piece {
				grid-area: next;
				--border-size: 12;
				width: 106px;
				height: 56px;
				padding: 3px;
			}

			.next_piece .value {
				position: relative;
				width: 106px;
				height: 56px;
			}

			.info {
				grid-area: info;
				display: grid;
				grid-template:
					'.' 1fr
					'level' auto
					'trt' auto /
					1fr;
			}

			.p1 .info {
				justify-items: end;
			}

			.p2 .info {
				justify-items: start;
			}

			.level {
				grid-area: level;
				width: 78px;
				height: 61px;
				padding: 3px;
			}

			.drought {
				grid-area: trt;
				width: 78px;
				height: 61px;
				padding: 3px;
				opacity: 0;
				color: red;
			}

			.drought.active {
				opacity: revert;
			}

			.tetris_rate {
				grid-area: trt;
				width: 78px;
				height: 61px;
				padding: 3px;
			}

			.board {
				grid-area: board;
				position: relative;
				--border-size: 12;
				padding: 3px;
				width: 356px;
				height: 716px;
			}

			.names {
				grid-area: name;
				/* width: 480px; */
				height: 28px;
				display: flex;
			}

			.profile {
				grid-area: board;
				z-index: 1;
				width: 356px;
				height: 716px;
				margin: auto;
				background: black;
				opacity: 0.9;
				font-family: 'M PLUS 1p';
				transition: opacity;
				transition-duration: 0.5s;
			}

			.profile[hidden] {
				opacity: 0;
			}

			.p1 .names {
				flex-direction: row;
			}

			.p2 .names {
				flex-direction: row-reverse;
			}

			.name {
				flex-grow: 1;
				font-family: 'Misaki Gothic';
				text-align: center;
			}

			.name .english {
				font-family: 'Press Start K';
				font-size: 60%;
				margin-left: 8px;
			}

			.hearts {
				text-align: right;
				display: flex;
				justify-content: flex-end;
			}

			.p1 .hearts {
				flex-direction: row;
			}

			.p2 .hearts {
				flex-direction: row-reverse;
			}

			.hearts .unlit {
				color: lightgray;
			}

			.hearts .lit {
				color: red;
			}

			/* small */

			.match.small {
				zoom: 0.6667;
			}

			.small .p1 {
				grid-template:
					'scores board' auto
					'. board' auto
					'info board' auto
					'name board' auto /
					auto auto;
			}

			.small .p2 {
				grid-template:
					'board scores' auto
					'board .' auto
					'board info' auto
					'board name' auto /
					auto auto;
			}

			.small .scores {
				grid-area: scores;
				display: flex;
				flex-direction: column;
			}

			.small .p1 .scores {
				align-items: flex-end;
			}

			.small .p2 .scores {
				align-items: flex-start;
			}

			.small .score {
				grid-area: unset;
			}

			.small .next_piece {
				grid-area: unset;
				padding: unset;
				position: absolute;
				top: -6px;
				right: -6px;
				z-index: 1;
			}

			.small .names {
				width: 460px;
			}
		</style>
	</head>
	<body>
		<template id="player">
			<div class="player">
				<div class="scores">
					<div class="box score">
						<div class="header">SCORE</div>
						<div class="value">0</div>
						<div class="diff">+ 0</div>
					</div>
					<div class="box lines">
						<div class="header">LINE</div>
						<div class="value">999</div>
					</div>
					<div class="box next_piece">
						<div class="value"></div>
					</div>
				</div>

				<div class="info">
					<div class="box level">
						<div class="header">LV</div>
						<div class="value">99</div>
					</div>
					<div class="box tetris_rate">
						<div class="header">TRT</div>
						<div class="value">---</div>
					</div>
					<div class="box drought">
						<div class="header">DRT</div>
						<div class="value">99</div>
					</div>
				</div>

				<div class="box board"></div>

				<div class="box names">
					<div class="name">なまえ<span class="english">(Name)</span></div>
					<div class="hearts">
						<span class="lit">Œ</span>
						<span class="unlit">Œ</span>
						<span class="unlit">Œ</span>
					</div>
				</div>

				<div class="profile" hidden>
					<wakutet-profile-card></wakutet-profile-card>
				</div>
			</div>
		</template>

		<template id="player_small">
			<div class="player">
				<div class="scores">
					<div class="box score">
						<div class="header">SCORE</div>
						<div class="value">0</div>
						<div class="diff">+ 0</div>
					</div>
					<div class="box lines">
						<div class="header">LINE</div>
						<div class="value">999</div>
					</div>
				</div>

				<div class="info">
					<div class="box level">
						<div class="header">LV</div>
						<div class="value">99</div>
					</div>
					<div class="box tetris_rate">
						<div class="header">TRT</div>
						<div class="value">-</div>
					</div>
					<div class="box drought">
						<div class="header">DRT</div>
						<div class="value">99</div>
					</div>
				</div>

				<div class="box board">
					<div class="box next_piece">
						<div class="value"></div>
					</div>
				</div>

				<div class="box names">
					<div class="name">なまえ<span class="english">(Name)</span></div>
					<div class="hearts">
						<span class="lit">Œ</span>
						<span class="unlit">Œ</span>
						<span class="unlit">Œ</span>
					</div>
				</div>

				<div class="profile" hidden>
					<wakutet-profile-card></wakutet-profile-card>
				</div>
			</div>
		</template>

		<template id="curtain">
			<div class="custom_curtain">
				<img src="http://localhost:8514/images/brand.png" />
			</div>
		</template>

		<div id="stream_bg"></div>

		<script>
			// custom view parameters which will be passed in the websocket URI
			const view_meta = new URLSearchParams({
				concurrent_2_matches: true,
				players: 4,
			});
		</script>
		<script src="/vendor/peerjs.1.5.4.min.js"></script>
		<script type="module">
			import QueryString from '/js/QueryString.js';
			import { translate } from '/views/utils.js';
			import CTMCompetitionPlayer from '/views/CTMCompetitionPlayer.js';
			import Competition from '/views/competition.js';
			import Gradient from '/views/gradient.js';

			const active_matches_query = QueryString.get('am') ?? '1,2';
			const active_matches = active_matches_query
				.split(',')
				.map(e => Number(e));
			const small = active_matches.length == 2;

			const stream_bg_node = document.getElementById('stream_bg');

			const player_template = document.getElementById('player');
			const player_small_template = document.getElementById('player_small');
			const players = [];

			const curtain_template = document.getElementById('curtain');

			const format_diff_common = (prefix, absDiff) => {
				const padded = String(absDiff).padStart(6, ' ');
				if (padded.length > 6) return padded;
				return prefix + padded;
			};

			[1, 2].forEach(match_num => {
				if (active_matches.indexOf(match_num) >= 0) {
					const match_node = document.createElement('div');
					match_node.id = `match${match_num}`;
					match_node.classList.add('match');
					if (small) match_node.classList.add('small');
					stream_bg_node.appendChild(match_node);

					[1, 2].forEach((player_num, player_idx) => {
						const player_fragment = document.importNode(
							small ? player_small_template.content : player_template.content,
							true
						);
						const player_node = player_fragment.querySelector('.player');
						const curtain_fragment = document.importNode(
							curtain_template.content,
							true
						);
						const curtain_node =
							curtain_fragment.querySelector('.custom_curtain');

						player_node.classList.add(`p${player_num}`);
						match_node.appendChild(player_node);

						const player = new CTMCompetitionPlayer(
							{
								score: player_node.querySelector(`.score .value`),
								level: player_node.querySelector(`.level .value`),
								lines: player_node.querySelector(`.lines .value`),
								trt: player_node.querySelector(`.tetris_rate .value`),
								preview: player_node.querySelector(`.next_piece .value`),
								field: player_node.querySelector(`.board`),
								drought: player_node.querySelector(`.drought .value`),
								diff: player_node.querySelector(`.score .diff`),
								drought_box: player_node.querySelector(`.drought`),
								curtain: curtain_node,
							},
							{
								field_pixel_size: 4.5,
								preview_pixel_size: 3,
								preview_align: 'cc',
								stereo: translate([1, 2], [-1, 1], player_num),
								format_diff: diff => {
									if (diff == 0) return '+     0';
									if (diff > 0) return format_diff_common('+', Math.abs(diff));
									if (diff < 0) return format_diff_common('-', Math.abs(diff));
								},
								plus_minus_lead_indicator: false,
								diff_color_gradient: new Gradient(
									'#0eff0e',
									'#ffffff',
									'#fd0009'
								), // green - white - red
								use_neutral_color: true,
							}
						);

						players.push(player);
					});
				} else {
					[1, 2].forEach((player_num, player_idx) => {
						players.push(new CTMCompetitionPlayer({}, {}));
					});
				}
			});

			const competition = new Competition(players);

			competition.API.setMatch = () => {};

			players.forEach((player, player_idx) => {
				player.onScore = () => {
					const match_index = player_idx < 2 ? 0 : 1;
					const match_players = players.slice(
						2 * match_index,
						2 * match_index + 2
					);

					competition.computeScoreDifferentials(match_players);
				};
			});

			// layout starts in 2 matches view
			competition.API.setMatch(null);

			// expose API into window for debugging
			window._NTC_API = competition.API;
		</script>
		<script type="module" src="//localhost:8516/play_screen.bundle.js"></script>
	</body>
</html>
