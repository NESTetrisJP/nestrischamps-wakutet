<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" type="text/css" href="/views/tetris.css" />
		<style>
			@import url('https://fonts.googleapis.com/css?family=M+PLUS+1p');

			@font-face {
				font-family: 'Misaki Gothic';
				src: url('/fonts/misaki_gothic.ttf');
			}

			#stream_bg {
				width: 1920px;
				height: 1000px;
			}

			.box {
				position: revert;
				margin: -4.5px;
				font-size: 24px;
				line-height: 30px;
			}

			.box .header {
				padding-bottom: 2px;
			}

			.match {
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.player {
				width: 960px;
				height: 1000px;
				display: grid;
			}

			.p1 {
				grid-template:
					'. . .' 1fr
					'. . scores' auto
					'. info board' auto
					'. name name' auto
					'. . .' 1fr /
					1fr auto auto;
			}

			.p2 {
				grid-template:
					'. . .' 1fr
					'scores . .' auto
					'board info .' auto
					'name name .' auto
					'. . .' 1fr /
					auto auto 1fr;
			}

			.scores {
				grid-area: scores;
				display: grid;
				grid-template:
					'score lines' auto
					'score next' auto /
					1fr auto;
			}

			.score {
				grid-area: score;
				padding: 3px;
				width: 224px;
				height: 100px;
				margin-top: auto;
			}

			.score .value,
			.score .diff {
				font-size: 32px;
				line-height: 36px;
				text-align: right;
				white-space: pre-wrap;
			}

			.lines {
				grid-area: lines;
				padding: 3px;
				width: 100px;
				height: 61px;
			}

			.next_piece {
				grid-area: next;
				--border-size: 12;
				padding: 3px;
				width: 106px;
				height: 56px;
			}

			.next_piece .value {
				position: relative;
				width: 106px;
				height: 56px;
			}

			.info {
				grid-area: info;
				display: grid;
				grid-template:
					'.' 1fr
					'level' auto
					'trt' auto /
					1fr;
			}

			.info .level {
				grid-area: level;
				width: 78px;
				height: 61px;
				padding: 3px;
			}

			.info .drought {
				grid-area: trt;
				width: 78px;
				height: 61px;
				padding: 3px;
			}

			.drought {
				opacity: 0;
				color: red;
			}

			.drought.active {
				opacity: revert;
			}

			.info .tetris_rate {
				grid-area: trt;
				width: 78px;
				height: 61px;
				padding: 3px;
			}

			.board {
				grid-area: board;
				position: relative;
				--border-size: 12;
				padding: 3px;
				width: 356px;
				height: 716px;
			}

			.names {
				grid-area: name;
				height: 28px;
				display: flex;
			}

			.profile {
				grid-area: board;
				z-index: 1;
				width: 356px;
				height: 716px;
				margin: auto;
				background: black;
				opacity: 0.9;
				font-family: 'M PLUS 1p';
				transition: opacity;
				transition-duration: 0.5s;
			}

			.profile.profile-hidden {
				opacity: 0;
			}

			.p1 .names {
				flex-direction: row;
			}

			.p2 .names {
				flex-direction: row-reverse;
			}

			.names .name {
				flex-grow: 1;
				font-family: 'Misaki Gothic';
				text-align: center;
			}

			.names .name .english {
				font-family: 'Press Start K';
				font-size: 60%;
				margin-left: 8px;
			}

			.names .hearts {
				/* width: 100px; */
				text-align: right;
				display: flex;
				justify-content: flex-end;
			}

			.p1 .names .hearts {
				flex-direction: row;
			}

			.p2 .names .hearts {
				flex-direction: row-reverse;
			}

			.names .hearts .unlit {
				color: lightgray;
			}

			.names .hearts .lit {
				color: red;
			}

			.hidden {
				display: none;
			}
		</style>
	</head>
	<body>
		<template id="player">
			<div class="player">
				<div class="scores">
					<div class="box score">
						<div class="header">SCORE</div>
						<div class="value">0</div>
						<div class="diff">+ 0</div>
					</div>
					<div class="box lines">
						<div class="header">LINE</div>
						<div class="value">999</div>
					</div>
					<div class="box next_piece">
						<div class="value"></div>
					</div>
				</div>

				<div class="info">
					<div class="box level">
						<div class="header">LV</div>
						<div class="value">99</div>
					</div>
					<div class="box tetris_rate">
						<div class="header">TRT</div>
						<div class="value">---</div>
					</div>
					<div class="box drought">
						<div class="header">DRT</div>
						<div class="value">99</div>
					</div>
				</div>

				<div class="box board"></div>

				<div class="box names">
					<div class="name">なまえ<span class="english">(Name)</span></div>
					<div class="hearts">
						<span class="lit">Œ</span>
						<span class="unlit">Œ</span>
						<span class="unlit">Œ</span>
					</div>
				</div>

				<div class="profile profile-hidden">
					<wakutet-profile-card></wakutet-profile-card>
				</div>

				<div class="hidden">
					<video class="player_vid"></video>
					<div class="hiddenname"></div>
					<div class="flag"></div>
					<div class="hiddenhearts">
						<div class="heart"></div>
					</div>
					<div class="tetris_diff">0.00</div>
					<div class="running_trt"></div>
					<div class="eff">---</div>
				</div>
			</div>
		</template>

		<template id="curtain">
			<div class="custom_curtain">
				<img
					src="http://localhost:8514/images/brand.png"
					style="max-width: 90px"
				/>
			</div>
		</template>

		<div id="stream_bg">
			<div id="match" class="match"></div>
			<!-- End Playing Fields -->
		</div>
		<!-- End Stream BG -->

		<!-- Audio -->

		<script>
			// custom view parameters which will be passed in the websocket URI
			const view_meta = new URLSearchParams({});
		</script>
		<script src="/vendor/peerjs.1.5.4.min.js"></script>
		<script type="module">
			// import '/views/bg.js';
			import QueryString from '/js/QueryString.js';
			import { translate } from '/views/utils.js';
			import CompetitionPlayer from '/views/CompetitionPlayer.js';
			import Competition from '/views/competition.js';
			import Gradient from '/views/gradient.js';

			const match_node = document.getElementById('match');
			const player_template = document.getElementById('player');
			const curtain_template = document.getElementById('curtain');

			const players = [1, 2].map(num => {
				const player_fragment = document.importNode(
					player_template.content,
					true
				);
				const player_node = player_fragment.querySelector('.player');
				const curtain_fragment = document.importNode(
					curtain_template.content,
					true
				);
				const curtain_node = curtain_fragment.querySelector('.custom_curtain');

				player_node.classList.add(`p${num}`);
				match_node.appendChild(player_node);

				const format_diff_common = (prefix, absDiff) => {
					const padded = String(absDiff).padStart(6, ' ');
					if (padded.length > 6) return padded;
					return prefix + padded;
				};

				const player = new CompetitionPlayer(
					{
						name: player_node.querySelector(`.hiddenname`),
						score: player_node.querySelector(`.score .value`),
						level: player_node.querySelector(`.level .value`),
						lines: player_node.querySelector(`.lines .value`),
						trt: player_node.querySelector(`.tetris_rate .value`),
						running_trt: player_node.querySelector(`.running_trt`),
						preview: player_node.querySelector(`.next_piece .value`),
						field: player_node.querySelector(`.board`),
						hearts: player_node.querySelector(`.hiddenhearts`),
						drought: player_node.querySelector(`.drought .value`),
						eff: player_node.querySelector(`.eff`),

						diff: player_node.querySelector(`.score .diff`),
						t_diff: player_node.querySelector(`.hidden .tetris_diff`),

						drought_box: player_node.querySelector(`.drought`),
						video: player_node.querySelector(`.player_vid`),
						flag: player_node.querySelector(`.flag`),

						curtain: curtain_node,
					},
					{
						field_pixel_size: 4.5,
						running_trt_dot_size: 5,
						preview_pixel_size: 3,
						preview_align: 'cc',
						stereo: translate([1, 2], [-1, 1], num),
						format_diff: diff => {
							if (diff == 0) return '+     0';
							if (diff > 0) return format_diff_common('+', Math.abs(diff));
							if (diff < 0) return format_diff_common('-', Math.abs(diff));
						},
						diff_color_gradient: new Gradient('#0eff0e', '#ffffff', '#fd0009'), // green - white - red
					}
				);

				return player;
			});

			const competition = new Competition(players);
		</script>
		<script type="module" src="//localhost:8516/play_screen.bundle.js"></script>
	</body>
</html>
